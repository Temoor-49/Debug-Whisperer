<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Silky Smooth Theme Transitions */
        * { transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        /* View Transitions API Customization */
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation-duration: 0.5s;
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Multi-Theme Framework */
        .theme-pro { --bg: #fcfcfd; --card: #ffffff; --text: #0f172a; --accent: #4f46e5; --border: #e2e8f0; }
        .theme-dark { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #6366f1; --border: #334155; }
        .theme-mono { --bg: #ffffff; --card: #ffffff; --text: #000000; --accent: #000000; --border: #000000; }
        .theme-cyber { --bg: #050505; --card: #0a0a0a; --text: #00ff41; --accent: #00ff41; --border: #00ff41; }

        .theme-mono { 
            background-image: radial-gradient(#e5e7eb 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
        
        .theme-cyber .mono-font { text-shadow: 0 0 5px #00ff41; }
        .theme-cyber * { border-radius: 0 !important; }
        
        /* High Quality Animations */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-reveal { animation: fadeInScale 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        /* Custom Tooltip Animation */
        .tooltip-visible {
            animation: tooltipIn 0.2s ease-out forwards;
        }
        @keyframes tooltipIn {
            from { opacity: 0; transform: translate(-50%, 5px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
